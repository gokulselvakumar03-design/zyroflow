<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | ZyroFlow</title>
  <script>
    (function() {
      // Redirect standalone profile.html access directly to the user's workspace dashboard with openSettings=true
      try {
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        const role = (currentUser.role || localStorage.getItem('userRole') || localStorage.getItem('role') || 'employee').toString().toLowerCase().trim();
        
        const dashboardMap = {
          admin: 'admin-dashboard.html',
          employee: 'employee.html',
          accounts: 'accounts-dashboard.html',
          manager: 'manager-dashboard.html',
          cfo: 'cfo-dashboard.html',
          md: 'md-dashboard.html',
          'managing director': 'md-dashboard.html'
        };

        const targetDashboard = dashboardMap[role] || 'employee.html';
        window.location.replace(targetDashboard + '?openSettings=true');
      } catch(e) {
        window.location.replace('employee.html?openSettings=true');
      }
    })();
  </script>
</head>
<body style="background:#071029; color:#f8fafc; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <div style="text-align:center;">
    <div style="font-size:1.5rem; font-weight:700; margin-bottom:8px;">Opening Settings...</div>
    <div style="color:#94a3b8; font-size:0.9rem;">Redirecting to your ZyroFlow workspace...</div>
  </div>
</body>
</html>
