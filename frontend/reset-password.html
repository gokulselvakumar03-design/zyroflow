<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyroFlow - Reset Your Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-left-start: #071A3D;
            --bg-left-end: #0E2A5C;
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --surface: #FFFFFF;
            --border: #E2E8F0;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #071A3D 0%, #0E2A5C 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-primary);
        }

        .reset-card {
            background: var(--surface);
            border-radius: 20px;
            max-width: 460px;
            width: 100%;
            padding: 36px 32px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(226, 232, 240, 0.8);
            position: relative;
            overflow: hidden;
        }

        .reset-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #2563EB, #38BDF8);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-mark {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563EB, #38BDF8);
            display: grid;
            place-items: center;
            font-size: 0.95rem;
            font-weight: 800;
            color: #fff;
        }

        .brand-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0F172A;
            letter-spacing: -0.02em;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            height: 46px;
            padding: 0 42px 0 14px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1.5px solid #CBD5E1;
            border-radius: 10px;
            color: #0F172A;
            background: #FFFFFF;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.12);
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: #94A3B8;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-btn:hover {
            color: #475569;
        }

        .submit-btn {
            width: 100%;
            height: 48px;
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 0.98rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message-strip {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            line-height: 1.45;
            margin-bottom: 20px;
            display: none;
        }

        .message-strip.show {
            display: block;
        }

        .message-strip.error {
            background: #FEF2F2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
        }

        .message-strip.success {
            background: #F0FDF4;
            color: #166534;
            border: 1px solid #86EFAC;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            text-align: center;
            width: 100%;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="reset-card">
        <div class="brand-badge">
            <div class="logo-mark">ZF</div>
            <div class="brand-name">ZyroFlow</div>
        </div>

        <h1 class="card-title">Reset Your Password</h1>
        <p class="card-subtitle">Please create a strong new password for your account.</p>

        <div id="errorStrip" class="message-strip error"></div>
        <div id="successStrip" class="message-strip success"></div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label class="form-label" for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="newPassword" class="form-input" placeholder="Enter new password" required autocomplete="new-password">
                    <button type="button" class="toggle-btn" id="toggleNewPassword" aria-label="Toggle password visibility">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm new password" required autocomplete="new-password">
                    <button type="button" class="toggle-btn" id="toggleConfirmPassword" aria-label="Toggle password visibility">👁️</button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                Reset Password
            </button>
        </form>

        <a href="login.html" class="back-link">← Back to Login</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || '';

        const form = document.getElementById('resetPasswordForm');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const toggleNewPassword = document.getElementById('toggleNewPassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const errorStrip = document.getElementById('errorStrip');
        const successStrip = document.getElementById('successStrip');

        // Toggle Password Visibility
        toggleNewPassword.addEventListener('click', () => {
            const isPassword = newPasswordInput.type === 'password';
            newPasswordInput.type = isPassword ? 'text' : 'password';
        });

        toggleConfirmPassword.addEventListener('click', () => {
            const isPassword = confirmPasswordInput.type === 'password';
            confirmPasswordInput.type = isPassword ? 'text' : 'password';
        });

        // Input listeners to clear error
        [newPasswordInput, confirmPasswordInput].forEach(inp => {
            inp.addEventListener('input', () => {
                errorStrip.textContent = '';
                errorStrip.classList.remove('show');
            });
        });

        // Check if token exists in URL
        if (!token) {
            errorStrip.textContent = 'Invalid or missing password reset token. Please request a new link from the login page.';
            errorStrip.classList.add('show');
            submitBtn.disabled = true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorStrip.textContent = '';
            errorStrip.classList.remove('show');
            successStrip.classList.remove('show');

            if (!token) {
                errorStrip.textContent = 'Invalid or missing password reset token. Please request a new link from the login page.';
                errorStrip.classList.add('show');
                return;
            }

            const newPassword = newPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            if (!newPassword) {
                errorStrip.textContent = 'Please enter a new password.';
                errorStrip.classList.add('show');
                newPasswordInput.focus();
                return;
            }

            if (newPassword.length < 6) {
                errorStrip.textContent = 'Password must be at least 6 characters long.';
                errorStrip.classList.add('show');
                newPasswordInput.focus();
                return;
            }

            if (newPassword !== confirmPassword) {
                errorStrip.textContent = 'Passwords do not match. Please re-enter your password.';
                errorStrip.classList.add('show');
                confirmPasswordInput.focus();
                return;
            }

            submitBtn.disabled = true;
            const originalBtnText = submitBtn.textContent;
            submitBtn.innerHTML = '<span class="spinner"></span> Resetting Password...';

            try {
                const resetUrl = '/api/auth/reset-password';

                let res = await fetch(resetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token,
                        newPassword,
                        confirmPassword
                    })
                }).catch(() => null);

                // Fallback attempt to relative endpoint if absolute failed
                if (!res || !res.ok) {
                    const fallbackRes = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token,
                            newPassword,
                            confirmPassword
                        })
                    }).catch(() => null);
                    if (fallbackRes) res = fallbackRes;
                }

                const data = res ? await res.json().catch(() => ({})) : {};

                if (!res || !res.ok) {
                    errorStrip.textContent = data.message || 'Failed to reset password. The link may have expired or already been used.';
                    errorStrip.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                    return;
                }

                form.style.display = 'none';
                successStrip.textContent = 'Password reset successful. You can now log in.';
                successStrip.classList.add('show');

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (err) {
                console.error('[RESET PASSWORD] Error:', err);
                errorStrip.textContent = 'A network error occurred. Please try again.';
                errorStrip.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
            }
        });
    </script>
</body>

</html>
